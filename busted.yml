---
base: lua51
name: busted
globals:
  describe:
    args:
      - type: string
      - type: function
  it:
    args:
      - type: string
      - type: function
  pending:
    args:
      - type: string
      - type: function
        required: false
  before_each:
    args:
      - type: function
  after_each:
    args:
      - type: function
  setup:
    args:
      - type: function
  teardown:
    args:
      - type: function
  assert:
    any: true
  assert.*:
    any: true
