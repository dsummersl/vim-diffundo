name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Sync deps (dev)
        run: uv sync --group dev

      - name: CI
        run: make ci

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: ignore

  plugin-import:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    container: python:${{ matrix.python-version }}-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import the plugin package
        run: PYTHONPATH=pythonx:tests/stubs python -c "import diffundo; diffundo.VimInterface()"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.x"

      - name: Set up neovim
        uses: rhysd/action-setup-vim@v1
        id: nvim
        with:
          neovim: true
          version: v0.11.3

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the nvim python3 provider
        run: pip install pynvim

      - name: End-to-end tests
        run: make e2e
        env:
          DENOPS_TEST_NVIM_EXECUTABLE: ${{ steps.nvim.outputs.executable }}
