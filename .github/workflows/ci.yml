name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Sync deps (dev)
        run: uv sync --group dev

      - name: CI
        run: make ci

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: ignore

  plugin-import:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    container: python:${{ matrix.python-version }}-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import the plugin package
        run: PYTHONPATH=pythonx:tests/stubs python -c "import diffundo; diffundo.VimInterface()"
