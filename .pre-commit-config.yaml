repos:
- repo: https://github.com/JohnnyMorganz/StyLua
  rev: v2.3.0
  hooks:
  - id: stylua-github
- repo: local
  hooks:
  - id: selene
    name: selene
    entry: selene
    language: system
    types: [lua]
  - id: ast-grep
    name: ast-grep
    entry: ast-grep scan
    language: system
    types: [lua]
    pass_filenames: true
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: check-merge-conflict
  - id: end-of-file-fixer
  - id: trailing-whitespace
